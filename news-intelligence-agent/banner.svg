<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17213a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9012"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <path d="M0 126H1200M0 252H1200M0 378H1200M0 504H1200"/>
    <path d="M200 0V630M400 0V630M600 0V630M800 0V630M1000 0V630"/>
  </g>

  <!-- accent bar -->
  <rect x="80" y="120" width="12" height="390" rx="6" fill="url(#accent)"/>

  <!-- text column: x 128 to 860 -->
  <text x="128" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#9fb0cc" letter-spacing="6">APIFY ACTOR</text>
  <text x="128" y="258" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#ffffff">AI News Research Agent</text>
  <text x="128" y="326" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#e3e9f5">Question in. Cited brief out. No API key.</text>
  <text x="128" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#9fb0cc">Google News, RSS, Reddit and X. Read in full, cited.</text>

  <!-- chips -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">
    <rect x="128" y="436" width="250" height="50" rx="25" fill="#1f2d4d" stroke="#3a4d78"/>
    <text x="253" y="468" text-anchor="middle" fill="#ffffff">Limited permissions</text>
    <rect x="396" y="436" width="160" height="50" rx="25" fill="#1f2d4d" stroke="#3a4d78"/>
    <text x="476" y="468" text-anchor="middle" fill="#ffffff">MCP ready</text>
    <rect x="574" y="436" width="236" height="50" rx="25" fill="#1f2d4d" stroke="#3a4d78"/>
    <text x="692" y="468" text-anchor="middle" fill="#ffffff">Articles-only mode</text>
  </g>

  <!-- brief card glyph, right column x 920 to 1090 -->
  <g transform="translate(956 200)">
    <rect x="0" y="0" width="170" height="220" rx="20" fill="#ffffff" opacity="0.97"/>
    <rect x="20" y="24" width="130" height="20" rx="5" fill="#0b1220"/>
    <rect x="20" y="60" width="64" height="64" rx="8" fill="url(#accent)"/>
    <rect x="96" y="62" width="54" height="9" rx="4" fill="#9fb0cc"/>
    <rect x="96" y="80" width="54" height="9" rx="4" fill="#9fb0cc"/>
    <rect x="96" y="98" width="54" height="9" rx="4" fill="#9fb0cc"/>
    <rect x="96" y="116" width="40" height="9" rx="4" fill="#9fb0cc"/>
    <rect x="20" y="142" width="130" height="9" rx="4" fill="#9fb0cc"/>
    <rect x="20" y="160" width="130" height="9" rx="4" fill="#9fb0cc"/>
    <rect x="20" y="178" width="96" height="9" rx="4" fill="#9fb0cc"/>
    <text x="52" y="106" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0b1220">AI</text>
  </g>
</svg>
